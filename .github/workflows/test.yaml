name: Test features

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the dev container CLI
        run: npm install -g @devcontainers/cli

      # The default test.sh, on the image the docs lead with.
      - name: Test defaults
        run: |
          devcontainer features test -f claude-sandbox \
            --base-image mcr.microsoft.com/devcontainers/base:bookworm \
            --skip-scenarios .

      # The option matrix: firewall off, extra domains + bypass mode with
      # blanket sudo retained, and a bare-root image with no sudo at all.
      - name: Test scenarios
        run: |
          devcontainer features test -f claude-sandbox --skip-autogenerated .
